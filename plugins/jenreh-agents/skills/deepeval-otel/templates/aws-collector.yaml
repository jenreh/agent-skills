# ADOT/contrib collector with awsxray support; pin a compatible distribution.
# Local/shared network namespace only. Adapt binding/TLS/auth for remote callers.
# Set AWS_REGION and provide the collector's AWS role/credential chain externally.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch: {}

exporters:
  awsxray:
    region: ${env:AWS_REGION}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
