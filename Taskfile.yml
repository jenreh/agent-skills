version: "3"

vars:
  # skill-dojo pinned to the same version as registry/config.yaml and
  # .github/workflows/validate-marketplace.yml. Change all three together.
  SKILL_DOJO_VERSION: 0.0.1
  SKILL_DOJO: uvx skill-dojo=={{.SKILL_DOJO_VERSION}}

tasks:
  validate:
    desc: Validate plugins, skills, catalogs and registry/ (Agent Plugins 1.0.0, drift, MCP pins)
    cmds:
      - "{{.SKILL_DOJO}} validate"

  build:
    desc: Regenerate both catalogs, manifests, provenance metadata and the layout links
    cmds:
      - "{{.SKILL_DOJO}} build"

  build:check:
    desc: Fail if build would change any file (what CI runs)
    cmds:
      - "{{.SKILL_DOJO}} build --check"

  lock:refresh:
    desc: Record an edit to a local plugin in registry/lock.json (then commit it)
    cmds:
      - "{{.SKILL_DOJO}} lock refresh"

  list:
    desc: List all skills with their description
    cmds:
      - |
        for d in skills/*/; do
          name=$(basename "$d")
          desc=$(awk '/^description:/{sub(/^description:[ ]*/,"");print;exit}' "$d/SKILL.md")
          printf "  %-34s %s\n" "$name" "$desc"
        done
